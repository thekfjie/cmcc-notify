name: optional-integrations-test

on:
  push:
    paths:
      - 'integrations/**'
      - '.github/workflows/integrations-test.yml'
  pull_request:
    paths:
      - 'integrations/**'
      - '.github/workflows/integrations-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s integrations/codex -p 'test_*.py'
