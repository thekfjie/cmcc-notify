name: cmcc-sdk-test

on:
  push:
    paths:
      - 'cmcc/**'
      - '.github/workflows/cmcc-test.yml'
  pull_request:
    paths:
      - 'cmcc/**'
      - '.github/workflows/cmcc-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
      - working-directory: cmcc
        run: GOWORK=off go test -race ./...
      - working-directory: cmcc
        run: GOWORK=off go vet ./...
