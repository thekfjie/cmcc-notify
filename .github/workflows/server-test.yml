name: standalone-server-test

on:
  push:
    paths:
      - 'cmcc/**'
      - 'server/**'
      - '.github/workflows/server-test.yml'
  pull_request:
    paths:
      - 'cmcc/**'
      - 'server/**'
      - '.github/workflows/server-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache-dependency-path: |
            cmcc/go.sum
            server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - name: Build embedded WebUI
        working-directory: server/web
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Verify generated WebUI is current
        run: git diff --exit-code -- server/internal/httpapi/web
      - working-directory: server
        run: GOWORK=off go test -race ./...
      - working-directory: server
        run: GOWORK=off go vet ./...
      - name: Build standalone server image
        run: docker build -f server/Dockerfile -t cmcc-notify/server:test .
      - name: Verify runtime TLS trust store
        run: >-
          docker run --rm --entrypoint /bin/sh cmcc-notify/server:test
          -c 'test -s /etc/ssl/certs/ca-certificates.crt'
