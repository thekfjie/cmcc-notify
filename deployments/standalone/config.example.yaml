listen: ":8080"
auth_token_file: /run/secrets/auth_token
state_file: /var/lib/cmcc-notify/state.yaml

accounts:
  - name: primary
    note: "Primary notification channel"
    enabled: true
    api_key_file: /run/secrets/cmcc_api_key

groups: []

# Create applications from the WebUI so the complete token is displayed once
# and only its SHA-256 hash is persisted in state.yaml.
applications: []
